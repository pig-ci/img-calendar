<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>圖片日曆</title>
  <!-- 首幀前套用主題，避免閃爍。邏輯與 app.js 的 initTheme 保持一致 -->
  <script>
    (function () {
      var saved = localStorage.getItem('photo-calendar-theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="app-header">
    <button id="btnPrev" class="nav-btn" aria-label="上個月">‹</button>
    <h1 id="navTitle" class="nav-title">載入中…</h1>
    <button id="btnNext" class="nav-btn" aria-label="下個月">›</button>
    <button id="btnToday" class="today-btn">今天</button>
    <button id="btnTheme" class="nav-btn theme-btn" aria-label="切換為深色模式">
      <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/>
      </svg>
      <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2"/>
        <path d="M12 20v2"/>
        <path d="m4.93 4.93 1.41 1.41"/>
        <path d="m17.66 17.66 1.41 1.41"/>
        <path d="M2 12h2"/>
        <path d="M20 12h2"/>
        <path d="m6.34 17.66-1.41 1.41"/>
        <path d="m19.07 4.93-1.41 1.41"/>
      </svg>
    </button>
  </header>

  <main class="calendar-wrap">
    <div class="weekday-row" id="weekdayRow"></div>
    <div class="month-grid" id="monthGrid"></div>
  </main>

  <dialog id="eventDialog" class="event-dialog">
    <form method="dialog" id="eventForm">
      <h2 id="eventDialogTitle">新增事件</h2>

      <label class="field">
        <span>標題</span>
        <input type="text" id="evTitle" required maxlength="80" />
      </label>

      <label class="field">
        <span>日期</span>
        <input type="date" id="evDate" required />
      </label>

      <label class="field field-inline">
        <input type="checkbox" id="evAllDay" checked />
        <span>全天</span>
      </label>

      <div class="field time-fields" id="timeFields" hidden>
        <label>
          <span>開始</span>
          <input type="time" id="evStartTime" value="09:00" />
        </label>
        <label>
          <span>結束</span>
          <input type="time" id="evEndTime" value="10:00" />
        </label>
      </div>

      <label class="field">
        <span>描述</span>
        <textarea id="evDescription" rows="2" maxlength="500"></textarea>
      </label>

      <!-- 圖片：原生 file input 隱藏，由 .file-trigger 觸發 -->
      <div class="field">
        <span>圖片</span>
        <input type="file" id="evImage" accept="image/*" class="file-input" />
        <label class="file-trigger" for="evImage">
          <svg class="file-trigger-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <span id="fileTriggerText">選擇圖片</span>
        </label>
      </div>

      <div class="image-preview" id="imagePreview" hidden>
        <img id="imagePreviewImg" alt="預覽" />
        <button type="button" id="btnRemoveImage" class="remove-image">移除圖片</button>
      </div>

      <div class="dialog-actions">
        <button type="button" id="btnDeleteEvent" class="danger" hidden>刪除</button>
        <span class="spacer"></span>
        <button type="button" id="btnCancelEvent" class="ghost">取消</button>
        <button type="submit" id="btnSaveEvent" class="primary">儲存</button>
      </div>
    </form>
  </dialog>

  <dialog id="lightbox" class="lightbox">
    <img id="lightboxImg" alt="" />
    <button type="button" id="btnCloseLightbox" class="lightbox-close" aria-label="關閉">×</button>
  </dialog>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
